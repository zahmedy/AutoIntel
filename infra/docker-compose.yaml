services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: autointel
      POSTGRES_PASSWORD: autointel
      POSTGRES_DB: autointel
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autointel -d autointel"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    env_file:
      - .env
    command: >
      /bin/sh -c "
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    environment:
      - ENV=dev
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DATABASE_URL=postgresql+psycopg://autointel:autointel@db:5432/autointel
      - JWT_SECRET=change-me-super-secret
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - GOOGLE_REDIRECT_URI
      - GOOGLE_LOGIN_SUCCESS_URL
      - GOOGLE_ALLOWED_SUCCESS_URLS
      - APPLE_CLIENT_ID
      - APPLE_TEAM_ID
      - APPLE_KEY_ID
      - APPLE_PRIVATE_KEY
      - APPLE_REDIRECT_URI
      - APPLE_LOGIN_SUCCESS_URL
      - APPLE_ALLOWED_SUCCESS_URLS
      - OPENAI_API_KEY
      - OPENAI_TEXT_MODEL=gpt-4o-mini
      - PRICE_PREDICTION_API_URL=${PRICE_PREDICTION_API_URL:-http://host.docker.internal:8080/v1/price/predict}
      - PRICE_PREDICTION_API_TIMEOUT_SECONDS=15
      - VIN_SCAN_DEBUG=false
      - VIN_SCAN_API_URL=${VIN_SCAN_API_URL:-http://host.docker.internal:8080/v1/vin/photo}
      - VIN_SCAN_API_TIMEOUT_SECONDS=30
      - S3_ACCESS_KEY
      - S3_SECRET_KEY
      - S3_BUCKET=${S3_BUCKET:-nicherides}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_KEY_PREFIX=${S3_KEY_PREFIX:-cars-photos}
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE
    env_file:
      - .env
    environment:
      - INTERNAL_API_BASE=http://api:8000
      - NEXT_PUBLIC_API_BASE
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 700M

  caddy:
    image: caddy:latest
    container_name: nicherides-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
